<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Entailment Tree Viewer</title>

  <!-- ===== size dial: swap 380px for any width you like =============== -->
  <style>
    :root {
      --side: 15%;
    }

    /* ----- layout ---------------------------------------------------- */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f9f9f9;
      height: 100vh;
      overflow: hidden;
    }

    #full-text-box {
      width: 100%;
      overflow-wrap: break-word;
      font-size: 1em;
    }

    #side {
      flex: 0 0 var(--side);
      font-size: clamp(12px, 0.8vw + 0.5rem, 16px);
      line-height: 1.35;
      /* min-width: 220px; */
      /* max-width: 480px; */
      border-right: 1px solid #e5e5e5;
      background: #fff;
      overflow: auto;
    }


    #tree-container {
      flex: 1;
      position: relative;
      overflow: auto;
    }

    #tree-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ----- legend ---------------------------------------------------- */
    #legend {
      padding: 12px 16px 8px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 3em;
    }

    .swatch {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 8px;
      border: 1px solid #999;
      vertical-align: middle;
    }

    .swatch.high {
      background: #2ca02c
    }

    .swatch.med {
      background: #ff7f0e
    }

    .swatch.low {
      background: #d62728
    }

    .swatch.na {
      background: #ccc;
      border-color: #ccc
    }

    /* ----- tooltip --------------------------------------------------- */
    .tooltip {
      position: absolute;
      background: rgba(255, 255, 255, .95);
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 2px;
      font-size: 12px;
      pointer-events: none;
      max-width: 300px;
      box-shadow: 1px 1px 4px rgba(0, 0, 0, .2);
      opacity: 0;
      transition: opacity .15s;
    }

    /* ----- nodes / links -------------------------------------------- */
    .link {
      fill: none;
      stroke: #bbb;
      stroke-width: 2px;
    }

    .node circle {
      /* stroke: steelblue; */
      stroke-width: 2px;
      transition: r .15s;
    }

    .node:hover circle {
      r: 7;
      cursor: pointer;
    }

    /* clicked node */
    .node.selected circle {
      stroke: #000;
      stroke-width: 1px;
    }

    /* direct parents & children */
    .node.related circle {
      stroke: #1f77b4;
      stroke-width: 1px;
    }

    .node.dimmed {
      opacity: 0.2;
    }

    /* ----- leaf scatter panel --------------------------------------- */
    :root { --sc-h: 45vh; }
    #scBtn {
      position: absolute; bottom: 10px; right: 70px; z-index: 10;
    }
    body.sc-open #resetBtn, body.sc-open #scBtn { bottom: calc(var(--sc-h) + 10px) !important; }  /* !important: resetBtn has an inline bottom */
    #scatter-panel {
      position: absolute; left: var(--side); right: 0; bottom: 0; height: var(--sc-h);
      z-index: 20; background: #fff; border-top: 1px solid #ccc;
      box-shadow: 0 -2px 8px rgba(0,0,0,.08); display: none; flex-direction: column;
    }
    body.sc-open #scatter-panel { display: flex; }
    #scatter-head {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 6px 12px; border-bottom: 1px solid #e5e5e5; font-size: 13px;
    }
    #scatter-head select, #scatter-head button { font: inherit; padding: 2px 6px; }
    #scatter-head .sp { flex: 1; }
    #sc-info { color: #666; }
    #scatter-scroll { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; position: relative; }
    #scatter-svg { display: block; }
    #sc-tip {
      position: absolute; display: none; pointer-events: none; z-index: 30;
      background: rgba(30,30,30,.92); color: #fff; font-size: 12px; padding: 6px 9px;
      border-radius: 4px; max-width: 320px;
    }
    #sc-tip .t { display: block; margin-top: 3px; opacity: .85; }
    #scatter-svg .sc-axis text { fill: #666; font-size: 10.5px; }
    #scatter-svg .sc-grid line { stroke: #eee; }
    #scatter-svg .sc-frame { fill: none; stroke: #ccc; }
    #scatter-svg .sc-title { fill: #333; font-size: 12px; }
    #scatter-svg .sc-sub { fill: #888; fill-opacity: .3; pointer-events: none; }
    #scatter-svg .sc-pt { stroke: #333; stroke-width: 1; cursor: pointer; transition: opacity .15s; }
    #scatter-svg .sc-pt:hover { stroke-width: 2; }
    #scatter-svg .sc-pt.sc-sel { stroke: #000; stroke-width: 3; }
    #scatter-svg .sc-pt.sc-dim { opacity: .12; }
    #scatter-svg .sc-xl { cursor: pointer; }
    #scatter-svg .sc-xl.sc-sel { fill: #d62728; font-weight: 700; }
    #scatter-svg .sc-xl.sc-dim { opacity: .25; }
  </style>
</head>

  <div id="side">
    <div id="full-text-box" style="padding:16px;white-space:pre-wrap;"></div>

  <!-- search box -->
  <input id="searchBox" placeholder="Search full text..."

   </span>

  <div id="tree-container"></div>
  <div id="tooltip" class="tooltip"></div>
  <button id="resetBtn" style="position:absolute;bottom:10px;right:10px;z-index:10;">Reset</button>
  <button id="scBtn" title="Scatter plot of leaf nodes: x = full text (tree order), y = mean score">Leaf scatter</button>

  <div id="scatter-panel">
    <div id="scatter-head">
      <strong>Leaf scores</strong>
      <label>Order
        <select id="sc-order">
          <option value="layout">Tree order (left → right)</option>
          <option value="text">Alphabetical</option>
          <option value="asc">Score, low → high</option>
          <option value="desc">Score, high → low</option>
        </select>
      </label>
      <label>Score
        <select id="sc-score"></select>
      </label>
      <label><input type="checkbox" id="sc-dots"> individual scores</label>
      <span id="sc-info"></span>
      <span class="sp"></span>
      <button id="sc-size" title="Taller / shorter">⤢</button>
      <button id="sc-close" title="Close">✕</button>
    </div>
    <div id="scatter-scroll"><svg id="scatter-svg"></svg></div>
    <div id="sc-tip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/d3-dag@0.6"></script>
  <script>
    /* canvas size */
    const margin = { top: 80, right: 80, bottom: 80, left: 80 };
    const NODE_R = 5;                   // base node radius
    const MAX_INITIAL_SCALE = 1         // auto-fit won’t zoom past this
    const TARGET_SCALE = 1.8;   // how far we zoom in on a click
    let currentZoom = 1;                 // track live scale for tooltip
    const BASE = 200;   // horizontal room for deeper layers
    const STEP = 200;
    const V_GAP = 120;   // vertical gap between layers (unchanged)


    let selectedScoreField = ''; // populated after data loads
    
    // Color mode
    let colorMode = 'score';
    function nodeColour(d) {
      if (colorMode === 'subset') {
        return subsetColour(d);
      }
      return colour(d);
    }

    /** Collect score field names from wb_scores dict and legacy top-level fields. */
    function collectScoreFields(data) {
      const keys = new Set();
      for (const node of data) {
        if (node.wb_scores && typeof node.wb_scores === 'object') {
          Object.keys(node.wb_scores).forEach(k => keys.add(k));
        }
        if (node.wb_score_mistral != null && node.wb_score_mistral !== '-') keys.add('wb_score_mistral');
        if (node.wb_score_llama != null && node.wb_score_llama !== '-') keys.add('wb_score_llama');
      }
      return [...keys];
    }

    function getScoreValue(node, field) {
      const fromDict = node?.wb_scores?.[field];
      if (fromDict != null && fromDict !== '-') return fromDict;
      const legacy = node?.[field];
      if (legacy != null && legacy !== '-') return legacy;
      return null;
    }

    // orig st
    // const colour = d => {

    //   const score = +raw;
    //   if (isNaN(score)) return '#ccc';

    //   // Normalize to 0–1 range
    //   const normalized = Math.max(0, Math.min(1, score / 10)); // assume 0–10 scale

    //   // Define diverging color scale
    //   const colorScale = d3.scaleLinear()
    //     .domain([0, 0.33, 0.66, 1]) // 4 stops
    //     .range(["darkred", "lightcoral", "lightblue", "darkblue"])
    //     .interpolate(d3.interpolateLab); // smoother transitions

    //   return colorScale(normalized);
    // };

    // ori end

    //new st
    // const colour = d => {
    // const raw = getScoreValue(d.data, selectedScoreField);
    // if (raw == null) return '#ccc';
    // const score = +raw;
    // if (isNaN(score)) return '#ccc';

    // const normalized = Math.max(0, Math.min(1, score)); // clamp to 0–1
    // return d3.interpolateRdYlGn(normalized);
    // };
    const colour = d => {
      const raw = getScoreValue(d.data, selectedScoreField);
      if (raw == null) return '#ccc';
      const score = +raw;
      if (isNaN(score)) return '#ccc';

      const normalized = selectedScoreField.startsWith('score_student')
        ? Math.max(0, Math.min(1, score))
        : Math.max(0, Math.min(1, score / 10));

        return d3.interpolateRdYlGn(normalized);
    };

    // new end




    /* helper for node colour */
    // const colour = sim =>
    //   sim == null || isNaN(sim) ? '#ccc'
    //     : sim > 0.8 ? '#2ca02c'
    //       : sim > 0.6 ? '#ff7f0e'
    //         : '#d62728';

    // ------------------------ Coloring node ------------------------ //
    const subsetColors = {
      physics: "#1f77b4",
      biology: "#2ca02c",
      chemistry: "#d62728",
      mixed: "#9467bd",
      unknown: "#cccccc"
    }

    function getSubset(node) {
      return node?.data?.subset || "unknown";
    }

    function subsetColour(d) {
      const subset = getSubset(d).toLowerCase();
      return subsetColors[subset] || "#cccccc";
    }

    // ----------------------------------------------------------- //

    /* ── globals we update ──────────────────────────────────── */
    const container = document.getElementById('tree-container');
    let svg, g, zoomBehaviour, tooltip, txtBox, root, fitted = false;

    /** DAG JSON via ?data=...: a basename (served from visualisation/) or a
     *  repo-relative path like demo_trees/foo.json (served from the repo root).
     *  Traversal/absolute/unsafe values fall back to tree_data.json. */
    function resolveViewerDataFile() {
      const raw = new URLSearchParams(location.search).get('data');
      const fallback = 'tree_data.json';
      if (!raw || raw.includes('..') || raw.startsWith('/') || raw.includes('\\')
          || !/^[\w][\w.\/-]*\.json$/.test(raw)) {
        return fallback;
      }
      // paths resolve from the served repo root; bare basenames stay relative
      // to viewer.html (i.e. inside visualisation/)
      return raw.includes('/') ? '/' + raw : raw;
    }

    /** Load the DAG JSON. Order: ?data=… / tree_data.json via fetch; if that is impossible (page opened from
     *  disk) or fails and no ?data= was requested, fall back to the embedded test data. */
    function loadViewerData(file) {
      const requested = new URLSearchParams(location.search).has('data');
      const embedded = () => {
        try {
          const j = JSON.parse(document.getElementById('embedded-data').textContent);
          if (Array.isArray(j) && j.length) {
            document.getElementById('data-source').hidden = false;
            return j;
          }
        } catch (e) { /* none */ }
        return null;
      };
      if (location.protocol === 'file:') {
        const e = embedded();
        if (e) return Promise.resolve(e);
      }
      return d3.json(file).catch(err => {
        const e = !requested && embedded();
        if (e) { console.warn('Could not load ' + file + ' – using embedded test data.', err); return e; }
        throw err;
      });
    }

    /* ── build everything once ──────────────────────────────── */
    function init() {
      svg = d3.select(container).append('svg');
      g = svg.append('g');

      tooltip = d3.select('#tooltip');
      txtBox = d3.select('#full-text-box');

      const dataFile = resolveViewerDataFile();
      loadViewerData(dataFile).then(data => {
        const scoreKeys = collectScoreFields(data);
        const sel = document.getElementById('score-select');
        sel.innerHTML = scoreKeys.map(k =>
          `<option value="${k}">${k.replace(/^score_/, '').replace(/^wb_score_/, '')}</option>`
        ).join('');
        selectedScoreField = scoreKeys[0] ?? '';

        const stratify = d3.dagStratify()
          .id(d => d.id)
          .parentIds(d => d.parentIds || []);
        root = stratify(data);
        const layout = d3.sugiyama().size([container.clientWidth - margin.left - margin.right,
        container.clientHeight - margin.top - margin.bottom]);
        layout(root);
        update();
      });

      // blank-click = clear side panel
      d3.select(container).on('click', e => {
        if (e.target.tagName !== 'circle') {
          txtBox.html('');
          g.selectAll('.node').classed('dimmed selected related', false);
          highlightScatter(null);
        }
      });

      // on window resize, redraw & refit
      window.addEventListener('resize', () => {
        fitted = false;
        update();
      });
      document.getElementById('score-select').addEventListener('change', function () {
        selectedScoreField = this.value;
        update(); // re-color nodes
      });

      // Coloring by subset
      document.getElementById('color-mode').addEventListener('change', function() {
        colorMode = this.value;
        document.getElementById('score-controls').style.display = colorMode === 'score' ? 'inline' : 'none';

        update();
      });

    }

    function update() {
      if (!root) return;

      const W = container.clientWidth;
      const H = container.clientHeight;
      const w = W - margin.left - margin.right;
      const h = H - margin.top - margin.bottom;

      const bottomLayer = d3.max(root.descendants(), n => n.layer);

      // d3-dag layout
      const layout = d3.sugiyama()
        .size([w, h])
        .layering(d3.layeringSimplex())
        .decross(d3.decrossTwoLayer())
        .nodeSize(n => {
          const layersAboveLeaf = bottomLayer - n.layer;
          const width = layersAboveLeaf === 0
            ? BASE
            : BASE * Math.pow(2, layersAboveLeaf);
          return [width, V_GAP];
        })
        .coord(d3.coordCenter());
      layout(root);

      // zoom behaviour (re-attach each draw)
      zoomBehaviour = d3.zoom()
        .extent([[0, 0], [W, H]])
        .scaleExtent([0.1, 4])
        .filter(e => !(e.type === 'wheel' && !e.ctrlKey))
        .on('zoom', e => {
          currentZoom = e.transform.k;
          g.attr('transform', e.transform);
          g.selectAll('.node foreignObject > div')
            .style('font-size', `${Math.max(5, 5 / currentZoom)}px`);
        });
      svg.call(zoomBehaviour);

      /* links */
      const link = g.selectAll('.link')
        .data(root.links(), d => d.target.data.id || d.target.data.name);

      const linkVertical = d3.linkVertical()
        .x(d => d.x)
        .y(d => d.y)

      link.join(
        enter => enter.append('path').attr('class', 'link'),
        update => update,
        exit => exit.remove()
      )
        .attr('d', d => linkVertical({ source: d.source, target: d.target }))
        .style('stroke-width', d => {
          // Use child (target) node's per-edge eval score; map 0..1 -> 1..6 px
          const s = (d && d.target && typeof d.target.data?.evalScore === 'number')
            ? Math.max(0, Math.min(1, d.target.data.evalScore))
            : null;
          return s == null ? 2 : (1 + 5 * s);
        });

      /* nodes */
      const node = g.selectAll('.node')
        .data(root.descendants(), d => d.data.id || d.data.prompt || '');

      const nodeEnter = node.enter().append('g').attr('class', 'node');

      nodeEnter.append('circle').attr('r', NODE_R);

      // label (prompt text, truncated)
      nodeEnter.append('foreignObject')
        .attr('x', -60).attr('y', NODE_R + 0.5)
        .attr('width', 120).attr('height', 40)
        .append('xhtml:div')
        .style('font-size', '5px')
        .style('text-align', 'center')
        .style('word-wrap', 'break-word')
        .style('width', '120px');

      nodeEnter.merge(node)
        .attr('transform', d => `translate(${d.x},${d.y})`)
        .on('mouseover', (e, d) => {
          //console.log("Hovered node:", d.data);
          tooltip.style('opacity', 1)
            .html(`<strong>Subset:</strong> ${d.data.subset ?? '-'}<br>
                    <strong>Similarity:</strong> ${d.data.similarity ?? '-'}<br>
                    <strong>Eval:</strong> ${d.data.evalScore ?? '-'}<br>
                    <strong>Entail-1:</strong> ${d.data.entail1}<br>
                    <strong>Entail-2:</strong> ${d.data.entail2}<br>
                    <strong>Faithfulness-1:</strong> ${d.data.faithfulness1 ?? '-'}<br>
                    <strong>Faithfulness-2:</strong> ${d.data.faithfulness2 ?? '-'}<br>
                    <strong>Informativeness-1:</strong> ${d.data.informativeness1 ?? '-'}<br>
                    <strong>Informativeness-2:</strong> ${d.data.informativeness2 ?? '-'}<br>
                    <strong>Spec-Faithful:</strong> ${d.data.specificity_faithfulness ?? '-'}<br>
                    <strong>Spec-Informative:</strong> ${d.data.specificity_informativeness ?? '-'}<br>
                    <strong>Summary Blocked:</strong> ${d.data.summary_blocked}<br>
                    <strong>${selectedScoreField.replace(/^score_/, '').replace(/^wb_score_/, '')} Score:</strong> ${getScoreValue(d.data, selectedScoreField) ?? 'n/a'}`)
            .style('left', (e.pageX + 10) + 'px')
            .style('top', (e.pageY + 5) + 'px')
            .style('transform-origin', 'top left')
            .style('transform', `scale(${currentZoom})`);
        })
        .on('mouseout', () => tooltip.style('opacity', 0))
        .on('click', (e, d) => selectNode(d));


      nodeEnter.merge(node).select('circle')
        .attr('fill', d => nodeColour(d));
        // .attr('fill', d => colour(d));

      nodeEnter.merge(node).select('foreignObject > div')
        .html(d => {
          const t = d.data.prompt || d.data.name || '';
          return t.length > 40 ? t.slice(0, 40) + '…' : t;
        });

      node.exit().remove();

      if (typeof scatterOpen !== 'undefined' && scatterOpen) drawScatter();

      /* auto-fit once per draw (or after resize) */
      if (!fitted) {
        fitToScreen(W, H);
        fitted = true;
      }
    }

    /* ── auto-fit whole tree to viewport ─────────────────────── */
    function fitToScreen(W, H) {
      const bbox = g.node().getBBox();
      const scale = Math.min(
        (W - margin.left - margin.right) / bbox.width,
        (H - margin.top - margin.bottom) / bbox.height,
        MAX_INITIAL_SCALE
      );
      const xOff = (W - bbox.width * scale) / 2 - bbox.x * scale;
      const yOff = (H - bbox.height * scale) / 2 - bbox.y * scale;

      const t = d3.zoomIdentity.translate(xOff, yOff).scale(scale);
      svg.call(zoomBehaviour.transform, t);
      currentZoom = scale;
    }


    /* ======================================================================
     *  Leaf scatter  —  x: leaf full_text (categorical), y: mean of wb_scores
     *  Linked with the tree: click a point/label = click the node.
     * ==================================================================== */
    let scatterOpen = false, scatterTall = false, scatterSelectedId = null;
    let scatterPts = [], scatterBoiler = [], scatterReady = false;

    const scEl = id => document.getElementById(id);
    const scFmt = (v, d = 3) => (v == null || !Number.isFinite(v)) ? '–' : String(+v.toFixed(d));
    const scEsc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const SVGNS = 'http://www.w3.org/2000/svg';
    function scMk(tag, attrs, parent) {
      const e = document.createElementNS(SVGNS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }

    function scatterPanelPx() { return scatterOpen ? scEl('scatter-panel').offsetHeight : 0; }

    /** Score keys for the scatter: the wb_scores dict only. The legacy wb_score_* fields are on a
     *  0–10 scale and would distort the mean, so they are used only if no wb_scores exist at all. */
    function scatterKeys() {
      const keys = new Set();
      root.descendants().forEach(n => {
        const ws = n.data.wb_scores;
        if (ws && typeof ws === 'object') Object.keys(ws).forEach(k => keys.add(k));
      });
      if (!keys.size) collectScoreFields(root.descendants().map(n => n.data)).forEach(k => keys.add(k));
      return [...keys].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }
    function scNum(data, key) {
      const raw = getScoreValue(data, key);
      if (raw == null) return null;            // guard: +null === 0
      const v = Number(raw);
      return Number.isFinite(v) ? v : null;
    }

    function scBoilerplate(texts) {
      const cnt = new Map();
      texts.forEach(t => { const i = t.indexOf(':'); if (i > 0 && i < 120) { const p = t.slice(0, i + 1); cnt.set(p, (cnt.get(p) || 0) + 1); } });
      const min = Math.max(3, Math.ceil(texts.length * 0.15));
      return [...cnt].filter(([, c]) => c >= min).map(([p]) => p);
    }
    function scSnippet(text, max = 26) {
      let t = String(text || '');
      for (const p of scatterBoiler) if (t.startsWith(p)) { t = t.slice(p.length); break; }
      t = t.replace(/\s+/g, ' ').trim();
      return t.length > max ? t.slice(0, max - 1).trimEnd() + '…' : t;
    }

    function scatterPoints() {
      const sources = new Set(root.links().map(l => l.source));
      let leaves = root.descendants().filter(n => !sources.has(n)).sort((a, b) => a.x - b.x);   // current tree order
      scatterBoiler = scBoilerplate(leaves.map(n => n.data.full_text || ''));

      const keys = scatterKeys(), sel = scEl('sc-score').value;
      const use = (sel && sel !== '__mean__') ? [sel] : keys;
      let pts = [], missing = 0;
      for (const n of leaves) {
        const per = {};
        keys.forEach(k => { const v = scNum(n.data, k); if (v != null) per[k] = v; });
        const vals = use.map(k => per[k]).filter(v => v != null);
        if (!vals.length) { missing++; continue; }
        pts.push({ node: n, id: n.data.id, y: vals.reduce((a, b) => a + b, 0) / vals.length, per, text: n.data.full_text || n.data.name || '' });
      }
      const mode = scEl('sc-order').value;
      if (mode === 'text') pts.sort((a, b) => a.text.localeCompare(b.text));
      if (mode === 'asc') pts.sort((a, b) => a.y - b.y);
      if (mode === 'desc') pts.sort((a, b) => b.y - a.y);
      pts.forEach((p, i) => { p.idx = i; });
      return { pts, missing, total: leaves.length };
    }

    /** same colour logic as the tree: score → red-yellow-green, or subset colours */
    function scatterFill(p) {
      if (colorMode === 'subset') return subsetColour(p.node);
      // student scores are 0–1; legacy wb_score_* values are 0–10
      return d3.interpolateRdYlGn(Math.max(0, Math.min(1, p.y > 1.0001 ? p.y / 10 : p.y)));
    }

    function drawScatter() {
      if (!root) return;
      const svg = scEl('scatter-svg'), box = scEl('scatter-scroll');
      svg.innerHTML = '';
      const { pts, missing, total } = scatterPoints();
      scatterPts = pts;
      const N = pts.length;
      scEl('sc-info').textContent = `${N} leaves` + (missing ? ` (${missing} without score)` : '') +
        (N ? ` · mean ${scFmt(pts.reduce((a, p) => a + p.y, 0) / N)}` : '');

      const m = { top: 14, right: 20, bottom: 150, left: 52 };
      const viewW = box.clientWidth || 800, H = box.clientHeight || 300;
      const W = Math.max(viewW, m.left + m.right + Math.max(N, 1) * 15);
      svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const iw = W - m.left - m.right, ih = Math.max(60, H - m.top - m.bottom), band = iw / Math.max(N, 1);
      const sx = i => m.left + (i + 0.5) * band;

      // y scale: 0–1 for the usual score range, otherwise fit
      const ys = pts.map(p => p.y);
      const unit = !ys.length || (Math.min(...ys) >= 0 && Math.max(...ys) <= 1);
      const lo = unit ? 0 : Math.min(0, Math.min(...ys)), hi = unit ? 1 : Math.ceil(Math.max(...ys));
      const sy = v => m.top + (1 - (v - lo) / (hi - lo)) * ih;
      const yt = unit ? [0, .2, .4, .6, .8, 1] : d3.ticks(lo, hi, 6);

      const grid = scMk('g', { class: 'sc-grid' }, svg), axis = scMk('g', { class: 'sc-axis' }, svg);
      yt.forEach(t => {
        scMk('line', { x1: m.left, x2: m.left + iw, y1: sy(t), y2: sy(t) }, grid);
        scMk('text', { x: m.left - 7, y: sy(t) + 4, 'text-anchor': 'end' }, axis).textContent = scFmt(t, 4);
      });
      scMk('rect', { class: 'sc-frame', x: m.left, y: m.top, width: iw, height: ih }, svg);

      const step = Math.max(1, Math.ceil(11 / band));
      pts.forEach((p, i) => {
        scMk('line', { x1: sx(i), x2: sx(i), y1: m.top + ih, y2: m.top + ih + 4, stroke: '#ccc' }, axis);
        if (i % step) return;
        const t = scMk('text', {
          class: 'sc-xl', 'data-id': p.id, 'text-anchor': 'end',
          transform: `translate(${sx(i) + 3} ${m.top + ih + 12}) rotate(-60)`
        }, axis);
        t.textContent = scSnippet(p.text);
        scMk('title', {}, t).textContent = p.text;
        t.addEventListener('click', () => selectNode(p.node));
      });

      const names = { layout: 'tree order', text: 'alphabetical', asc: 'score ascending', desc: 'score descending' };
      scMk('text', { class: 'sc-title', x: m.left + iw / 2, y: H - 6, 'text-anchor': 'middle' }, svg).textContent =
        `Leaf full_text (${names[scEl('sc-order').value]})` + (scatterBoiler.length ? ` · common opening “${scatterBoiler[0]}” hidden from labels` : '');
      const only = scEl('sc-score').value;
      scMk('text', { class: 'sc-title', transform: `translate(14 ${m.top + ih / 2}) rotate(-90)`, 'text-anchor': 'middle' }, svg)
        .textContent = (!only || only === '__mean__') ? 'Mean score' : only.replace(/^score_/, '').replace(/^wb_score_/, '');

      if (scEl('sc-dots').checked && (!only || only === '__mean__')) {
        const g0 = scMk('g', {}, svg);
        pts.forEach((p, i) => Object.values(p.per).forEach(v => scMk('circle', { class: 'sc-sub', cx: sx(i), cy: sy(v), r: 2.3 }, g0)));
      }

      const g1 = scMk('g', {}, svg);
      const r = Math.min(6.5, Math.max(3.5, band / 3));
      pts.forEach((p, i) => {
        const c = scMk('circle', {
          class: 'sc-pt', 'data-id': p.id, cx: sx(i), cy: sy(p.y), r, fill: scatterFill(p), tabindex: 0
        }, g1);
        c.addEventListener('mouseenter', ev => scTip(ev, p));
        c.addEventListener('mousemove', ev => scTip(ev, p));
        c.addEventListener('mouseleave', () => { scEl('sc-tip').style.display = 'none'; });
        c.addEventListener('click', () => selectNode(p.node));
        c.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectNode(p.node); } });
      });

      highlightScatter(scatterSelectedId);
      syncScatterDim(scEl('searchBox').value.toLowerCase());
    }

    function scTip(ev, p) {
      const tip = scEl('sc-tip'), panel = scEl('scatter-panel').getBoundingClientRect();
      const t = p.text.replace(/\s+/g, ' ');
      tip.innerHTML = `<b>Leaf ${scEsc(p.id)}</b> · ${scFmt(p.y)} <span style="opacity:.7">(${Object.keys(p.per).length} scores)</span>` +
        `<span class="t">${scEsc(t.length > 170 ? t.slice(0, 169) + '…' : t)}</span>`;
      tip.style.display = 'block';
      let x = ev.clientX - panel.left + 14, y = ev.clientY - panel.top - tip.offsetHeight - 12;
      if (x + tip.offsetWidth > panel.width - 4) x = ev.clientX - panel.left - tip.offsetWidth - 14;
      if (y < 4) y = ev.clientY - panel.top + 16;
      tip.style.left = Math.max(4, x) + 'px'; tip.style.top = y + 'px';
    }

    function highlightScatter(id) {
      scatterSelectedId = id;
      const svg = scEl('scatter-svg');
      if (!svg) return;
      svg.querySelectorAll('.sc-pt, .sc-xl').forEach(e => e.classList.toggle('sc-sel', id != null && e.getAttribute('data-id') === String(id)));
    }

    function syncScatterDim(term) {
      const svg = scEl('scatter-svg');
      if (!svg || !scatterPts.length) return;
      const hit = new Set(term ? scatterPts.filter(p => p.text.toLowerCase().includes(term)).map(p => String(p.id)) : scatterPts.map(p => String(p.id)));
      svg.querySelectorAll('.sc-pt, .sc-xl').forEach(e => e.classList.toggle('sc-dim', !hit.has(e.getAttribute('data-id'))));
    }

    /** Select a node exactly as a click on it in the tree does (used by tree and scatter). */
    function selectNode(d) {
      txtBox.html(`<strong>Full Text:</strong><br>${(d.data.full_text || '').replace(/\n/g, '<br>')}`);
      g.selectAll('.node').select('circle').attr('fill', n => nodeColour(n));

      // zoom to the node (centre it in the part of the tree that is not covered by the scatter panel)
      const W = container.clientWidth;
      const H = container.clientHeight - scatterPanelPx();
      const scale = Math.min(TARGET_SCALE, zoomBehaviour.scaleExtent()[1]);
      const transform = d3.zoomIdentity.translate(W / 2 - d.x * scale, H / 2 - d.y * scale).scale(scale);
      svg.transition().duration(750).call(zoomBehaviour.transform, transform);

      // highlight logic
      g.selectAll('.node').classed('selected related', false);
      g.selectAll('.node').filter(n => n === d).classed('selected', true);
      const related = new Set();
      root.links().forEach(l => {
        if (l.source === d) related.add(l.target);
        if (l.target === d) related.add(l.source);
      });
      g.selectAll('.node').filter(n => related.has(n)).classed('related', true);
      g.selectAll('.node').classed('dimmed', true);
      g.selectAll('.node.selected, .node.related').classed('dimmed', false);

      document.getElementById('searchBox').value = '';
      syncScatterDim('');
      highlightScatter(d.data.id);
    }

    function setScatterOpen(open) {
      scatterOpen = open;
      document.body.classList.toggle('sc-open', open);
      if (open && root) {
        if (!scatterReady) {
          const keys = scatterKeys();
          scEl('sc-score').innerHTML = `<option value="__mean__">Mean of all ${keys.length} scores</option>` +
            keys.map(k => `<option value="${scEsc(k)}">${scEsc(k.replace(/^score_/, '').replace(/^wb_score_/, ''))}</option>`).join('');
          scatterReady = true;
        }
        drawScatter();
      }
    }

    scEl('scBtn').addEventListener('click', () => setScatterOpen(!scatterOpen));
    scEl('sc-close').addEventListener('click', () => setScatterOpen(false));
    scEl('sc-size').addEventListener('click', () => {
      scatterTall = !scatterTall;
      document.documentElement.style.setProperty('--sc-h', scatterTall ? '75vh' : '45vh');
      if (scatterOpen) drawScatter();
    });
    ['sc-order', 'sc-score', 'sc-dots'].forEach(id => scEl(id).addEventListener('change', () => { if (scatterOpen) drawScatter(); }));
    let scLastW = 0, scLastH = 0;
    new ResizeObserver(() => {
      const b = scEl('scatter-scroll');
      if (!scatterOpen || (Math.abs(b.clientWidth - scLastW) < 2 && Math.abs(b.clientHeight - scLastH) < 20)) return;
      scLastW = b.clientWidth; scLastH = b.clientHeight;
      drawScatter();
    }).observe(scEl('scatter-scroll'));

    init();
    // Search logic
    document.getElementById('searchBox').addEventListener('input', e => {
      const term = e.target.value.toLowerCase();
      syncScatterDim(term);
      g.selectAll('.node')
        .classed('dimmed', d => {
          const text = (d.data.full_text || '').toLowerCase();
          return !text.includes(term);
        });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      const W = container.clientWidth;
      const H = container.clientHeight - scatterPanelPx();
      document.getElementById('searchBox').value = '';
      highlightScatter(null);
      syncScatterDim('');
      g.selectAll('.node').classed('dimmed selected related', false);
      g.selectAll('.link').classed('highlighted dimmed', false);
      txtBox.html('');
      fitToScreen(W, H);
    });
  </script>
</body>

</html>
